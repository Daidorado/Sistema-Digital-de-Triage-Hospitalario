# Netlify — TRIAGE DIGITAL
# Todas las rutas sirven index.html (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    # PWA: permite instalación y caché
    Cache-Control = "public, max-age=3600"
    X-Frame-Options = "SAMEORIGIN"
